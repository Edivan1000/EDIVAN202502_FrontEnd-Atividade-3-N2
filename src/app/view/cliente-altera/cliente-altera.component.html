<div class="container mt-5 p-4 bg-light rounded shadow-sm">
  <h2 class="mb-4">Alterar Cliente</h2>

  <!-- Dados do Cliente -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label>Nome:</label>
      <input type="text" [(ngModel)]="cliente.nome" class="form-control" required>
    </div>
    <div class="col-md-3">
      <label>CPF/CNPJ:</label>
      <input type="text" [(ngModel)]="cliente.cpfCnpj" class="form-control" required>
    </div>
    <div class="col-md-6 mt-3">
      <label>Email:</label>
      <input type="email" [(ngModel)]="cliente.email" class="form-control">
    </div>
    <div class="col-md-3 mt-3">
      <label>Telefone:</label>
      <input type="text" [(ngModel)]="cliente.telefone" class="form-control">
    </div>
  </div>

  <h4 class="mt-4">Endereço</h4>

  <!-- Endereço do Cliente -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label>Logradouro:</label>
      <input type="text" [(ngModel)]="endereco.logradouro" class="form-control">
    </div>
    <div class="col-md-2">
      <label>Número:</label>
      <input type="text" [(ngModel)]="endereco.numero" class="form-control">
    </div>
    <div class="col-md-4">
      <label>Bairro:</label>
      <input type="text" [(ngModel)]="endereco.bairro" class="form-control">
    </div>
    <div class="col-md-4 mt-3">
      <label>Cidade:</label>
      <input type="text" [(ngModel)]="endereco.cidade" class="form-control">
    </div>
    <div class="col-md-4 mt-3">
      <label>Estado:</label>
      <input type="text" [(ngModel)]="endereco.estado" class="form-control">
    </div>
    <div class="col-md-4 mt-3">
      <label>CEP:</label>
      <input type="text" [(ngModel)]="endereco.cep" class="form-control">
    </div>
  </div>

  <!-- Botões -->
  <div class="mt-4">
    <button class="btn btn-primary me-2" (click)="salvarAlteracoes()">Salvar Alterações</button>
    <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
  </div>
</div>
