<div class="container mt-5 p-4 bg-light rounded shadow-sm">
  <h2 class="mb-4">Cadastro de Cliente</h2>

  <!-- Dados do Cliente -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label>Nome:</label>
      <input type="text" [(ngModel)]="cliente.nome" class="form-control" required>
    </div>
    <!-- CPF/CNPJ -->
    <div class="col-md-3">
      <label>CPF/CNPJ:</label>
      <input type="text" [(ngModel)]="cliente.cpfCnpj" class="form-control" required
        mask="000.000.000-00||00.000.000/0000-00" [dropSpecialCharacters]="true" placeholder="CPF ou CNPJ">
    </div>

    <div class="col-md-6 mt-3">
      <label>Email:</label>
      <input type="email" [(ngModel)]="cliente.email" class="form-control">
    </div>
    <!-- Telefone -->
    <div class="col-md-3 mt-3">
      <label>Telefone:</label>
      <input type="text" [(ngModel)]="cliente.telefone" class="form-control" mask="(00) 00000-0000"
        [dropSpecialCharacters]="true" placeholder="(00) 00000-0000">
    </div>


    <h4 class="mt-4">Endereço</h4>

    <!-- Endereço do Cliente -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label>Logradouro:</label>
        <input type="text" [(ngModel)]="endereco.logradouro" class="form-control">
      </div>
      <!-- Número + S/N -->
<div class="col-md-4 mt-3 d-flex align-items-end">
  <div class="flex-grow-1 me-2">
    <label for="numero">Número:</label>
    <input type="text"
           id="numero"
           [(ngModel)]="endereco.numero"
           class="form-control"
           placeholder="Ex: 123"
           [disabled]="semNumero"
           (keypress)="permitirSomenteNumeros($event)">
  </div>

  <div class="form-check mb-2">
    <input type="checkbox"
           id="sn"
           class="form-check-input"
           [(ngModel)]="semNumero"
           (change)="endereco.numero = semNumero ? 'S/N' : ''">
    <label class="form-check-label" for="sn">S/N</label>
  </div>
</div>
      <div class="col-md-4">
        <label>Bairro:</label>
        <input type="text" [(ngModel)]="endereco.bairro" class="form-control">
      </div>
      <div class="col-md-4 mt-3">
        <label>Cidade:</label>
        <input type="text" [(ngModel)]="endereco.cidade" class="form-control">
      </div>
      <div class="col-md-4 mt-3">
        <label>Estado:</label>
        <input type="text" [(ngModel)]="endereco.estado" class="form-control">
      </div>
      <!-- CEP -->
      <div class="col-md-4 mt-3">
        <label>CEP:</label>
        <input type="text" [(ngModel)]="endereco.cep" class="form-control" mask="00000-000"
          [dropSpecialCharacters]="true" placeholder="00000-000">
      </div>


      <!-- Botões -->
      <div class="mt-4">
        <button class="btn btn-success me-2" (click)="salvarCliente()">Salvar</button>
        <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
