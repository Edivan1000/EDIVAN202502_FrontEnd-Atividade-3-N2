<div class="container mt-5 p-4 bg-light rounded shadow-sm">

  <h2 class="mb-4">Lista de Orçamentos</h2>

  <!-- BOTÃO DE INSERIR NO TOPO -->
  <div class="mb-3">
    <button class="btn btn-success" (click)="inserirOrcamento()">Novo Orçamento</button>
  </div>

  <!-- SEM ORÇAMENTOS -->
  <div *ngIf="orcamentos.length === 0" class="alert alert-info">
    Nenhum orçamento cadastrado.
  </div>

  <!-- TABELA -->
  <div *ngIf="orcamentos.length > 0" class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Código</th>
          <th>Data</th>
          <th>Total (R$)</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let orcamento of orcamentos" style="cursor: pointer;"
            (click)="editarOrcamento(orcamento)">

          <td>{{ orcamento.codigo }}</td>
          <td>{{ orcamento.dataOrcamento }}</td>
          <td>{{ orcamento.totalOrcamento | currency:'BRL' }}</td>

          <td class="text-center">
            <button
              class="btn btn-danger btn-sm"
              (click)="excluirOrcamento(orcamento, $event)">
              Excluir
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
