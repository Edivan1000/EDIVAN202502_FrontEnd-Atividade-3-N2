<form #empresaForm="ngForm" (ngSubmit)="salvarAlteracoes(empresaForm)">
    <div class="container-fluid py-5 cliente-consulta-bg">
        <div class="container light-card">
            <h2 class="mb-4 text-primary-neon border-bottom pb-2">
                <i class="bi bi-pencil-square me-2"></i> Alterar Empresa
            </h2>

            <div class="row mb-4">
                <div class="col-12">
                    <h4 class="text-secondary-neon mb-3">Informações Cadastrais e Contato</h4>
                </div>

                <div class="col-lg-11">
                    <div class="data-group-card p-4 form-fields-group">
                        <div class="row g-4">
                            <div class="col-md-4">
                                <label class="form-label data-label">Razão Social:</label>
                                <input type="text" name="razaoSocial" [(ngModel)]="empresa.razaoSocial"
                                    class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Nome Fantasia:</label>
                                <input type="text" name="nomeFantasia" [(ngModel)]="empresa.nomeFantasia"
                                    class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="cnpj" class="form-label data-label">CNPJ:</label>
                                <input type="text" id="cnpj" name="cnpj" [(ngModel)]="empresa.cnpj" class="form-control"
                                    required mask="00.000.000/0000-00" [dropSpecialCharacters]="true"
                                    placeholder="00.000.000/0000-00">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Email:</label>
                                <input type="email" name="email" [(ngModel)]="empresa.email" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="telefone" class="form-label data-label">Telefone:</label>
                                <input type="text" id="telefone" name="telefone" [(ngModel)]="empresa.telefone"
                                    class="form-control" mask="(00) 00000-0000" [dropSpecialCharacters]="true"
                                    placeholder="(00) 00000-0000">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-12">
                    <h4 class="text-secondary-neon mb-3">Endereço</h4>
                </div>

                <div class="col-lg-11">
                    <div class="data-group-card p-4 form-fields-group">
                        <div class="row g-4">
                            <div class="col-md-4">
                                <label for="cep" class="form-label data-label">CEP:</label>
                                <input type="text" id="cep" name="cep" [(ngModel)]="endereco.cep" class="form-control"
                                    mask="00000-000" [dropSpecialCharacters]="true" placeholder="00000-000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Logradouro:</label>
                                <input type="text" name="logradouro" [(ngModel)]="endereco.logradouro"
                                    class="form-control" required>
                            </div>
                            <div class="col-md-4 d-flex flex-column justify-content-end">
                                <div class="d-flex align-items-end">
                                    <div class="flex-grow-1 me-2">
                                        <label for="numero" class="form-label data-label">Número:</label>
                                        <input type="text" id="numero" name="numero" [(ngModel)]="endereco.numero"
                                            class="form-control" placeholder="Ex: 123" [disabled]="semNumero"
                                            (keypress)="permitirSomenteNumeros($event)">
                                    </div>
                                    <div class="form-check mb-2">
                                        <input type="checkbox" id="sn" name="sn" class="form-check-input"
                                            [(ngModel)]="semNumero" (change)="endereco.numero = semNumero ? 'S/N' : ''">
                                        <label class="form-check-label data-label" for="sn">S/N</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Bairro:</label>
                                <input type="text" name="bairro" [(ngModel)]="endereco.bairro" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Cidade:</label>
                                <input type="text" name="cidade" [(ngModel)]="endereco.cidade" class="form-control"
                                    required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label data-label">Estado:</label>
                                <input type="text" name="estado" [(ngModel)]="endereco.estado" class="form-control"
                                    required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-start mt-5">
                <button class="btn btn-lg me-3 btn-neon-primary" type="submit" [disabled]="!empresaForm.dirty">
                    <i class="bi bi-save me-2"></i> Salvar Alterações
                </button>

                <button class="btn btn-lg btn-outline-secondary" (click)="cancelar()" type="button">
                    <i class="bi bi-x-circle me-2"></i> Cancelar
                </button>
            </div>

        </div>
    </div>
</form>
