<div class="container mt-5 p-4 bg-light rounded shadow-sm">
  <h2 class="mb-4">Alterar Empresa</h2>

  <!-- Dados da Empresa -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label>Razão Social:</label>
      <input type="text" [(ngModel)]="empresa.razaoSocial" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label>Nome Fantasia:</label>
      <input type="text" [(ngModel)]="empresa.nomeFantasia" class="form-control">
    </div>
    <!-- CNPJ -->
    <div class="col-md-4">
      <label for="cnpj">CNPJ:</label>
      <input type="text" id="cnpj" [(ngModel)]="empresa.cnpj" class="form-control" required mask="00.000.000/0000-00"
        [dropSpecialCharacters]="true" placeholder="00.000.000/0000-00">
    </div>


    <div class="col-md-4 mt-3">
      <label>Email:</label>
      <input type="email" [(ngModel)]="empresa.email" class="form-control">
    </div>
    <!-- Telefone -->
    <div class="col-md-4 mt-3">
      <label for="telefone">Telefone:</label>
      <input type="text" id="telefone" [(ngModel)]="empresa.telefone" class="form-control" mask="(00) 00000-0000"
        [dropSpecialCharacters]="true" placeholder="(00) 00000-0000">
    </div>



    <h4 class="mt-4">Endereço</h4>

    <!-- Endereço da Empresa -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label>Logradouro:</label>
        <input type="text" [(ngModel)]="endereco.logradouro" class="form-control">
      </div>
      <!-- Número + S/N -->
      <div class="col-md-4 mt-3 d-flex align-items-end">
        <div class="flex-grow-1 me-2">
          <label for="numero">Número:</label>
          <input type="text" id="numero" [(ngModel)]="endereco.numero" class="form-control" placeholder="Ex: 123"
            [disabled]="semNumero" (keypress)="permitirSomenteNumeros($event)">
        </div>

        <div class="form-check mb-2">
          <input type="checkbox" id="sn" class="form-check-input" [(ngModel)]="semNumero"
            (change)="endereco.numero = semNumero ? 'S/N' : ''">
          <label class="form-check-label" for="sn">S/N</label>
        </div>
      </div>


      <label>Bairro:</label>
      <input type="text" [(ngModel)]="endereco.bairro" class="form-control">
    </div>
    <div class="col-md-4 mt-3">
      <label>Cidade:</label>
      <input type="text" [(ngModel)]="endereco.cidade" class="form-control">
    </div>
    <div class="col-md-4 mt-3">
      <label>Estado:</label>
      <input type="text" [(ngModel)]="endereco.estado" class="form-control">
    </div>
    <!-- CEP -->
    <div class="col-md-4 mt-3">
      <label for="cep">CEP:</label>
      <input type="text" id="cep" [(ngModel)]="endereco.cep" class="form-control" mask="00000-000"
        [dropSpecialCharacters]="true" placeholder="00000-000">
    </div>


    <!-- Botões -->
    <div class="mt-4">
      <button class="btn btn-primary me-2" (click)="salvarAlteracoes()">Salvar Alterações</button>
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
